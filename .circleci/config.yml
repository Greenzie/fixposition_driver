---
version: 2.1

orbs:
  greenzie: greenzie/build_and_publish_debs@volatile

jobs:
  debian_build:
    executor: greenzie/debianize_amd64
    steps:
      - checkout
      - run:
          name: Build and Publish Debian Package
          command: |
            pwd
            cd $CIRCLE_WORKING_DIRECTORY
            bash .circleci/build_debian_package.sh


workflows:
  version: 2
  pushbuild:
    jobs:
      # Build jobs
      - debian_build:
          context: GREENZIE
